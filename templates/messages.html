<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodApp - Сообщения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --primary: #667eea; --secondary: #764ba2; --dark: #1a1a2e; }
        body { background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%); min-height: 100vh; }
        .sidebar { background: rgba(0,0,0,0.3); min-height: 100vh; position: fixed; width: 260px; padding: 20px; }
        .nav-link { color: rgba(255,255,255,0.7); padding: 14px 20px; border-radius: 12px; margin: 4px 0; transition: all 0.3s; }
        .nav-link:hover, .nav-link.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .content { margin-left: 260px; padding: 30px; }
        .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; }
        .table-dark { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4"><h3 class="text-white">🍽️ FoodApp</h3></div>
        <nav>
            <a href="/dashboard" class="nav-link"><i class="bi bi-speedometer2 me-2"></i>Дашборд</a>
            <a href="/clients" class="nav-link"><i class="bi bi-people me-2"></i>Клиенты</a>
            <a href="/production" class="nav-link"><i class="bi bi-factory me-2"></i>Производство</a>
            <a href="/orders" class="nav-link"><i class="bi bi-cart me-2"></i>Заказы</a>
            <a href="/messages" class="nav-link active"><i class="bi bi-envelope me-2"></i>Сообщения</a>
            <a href="/feedback" class="nav-link"><i class="bi bi-chat-dots me-2"></i>Обратная связь</a>
            <a href="/logs" class="nav-link"><i class="bi bi-journal-text me-2"></i>Логи</a>
        </nav>
        <div class="position-absolute bottom-0 start-0 end-0 p-3">
            <a href="/logout" class="btn btn-outline-light w-100"><i class="bi bi-box-arrow-right me-2"></i>Выход</a>
        </div>
    </div>
    <div class="content">
        <h2 class="mb-4">Сообщения</h2>
        
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card p-4">
                    <h5 class="mb-3">Новое сообщение</h5>
                    <form method="POST" action="/send_message">
                        <div class="mb-3">
                            <label class="form-label">Кому</label>
                            <select name="recipient_id" class="form-control" required>
                                {% for u in users %}
                                <option value="{{ u.id }}">{{ u.full_name or u.username }} ({{ u.role }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Сообщение</label>
                            <textarea name="content" class="form-control" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Отправить</button>
                    </form>
                </div>
            </div>
            
            <div class="col-md-6 mb-4">
                <div class="card p-4">
                    <h5 class="mb-3">Полученные</h5>
                    <div class="list-group">
                        {% for m in received %}
                        <div class="list-group-item bg-dark border-secondary">
                            <div class="d-flex justify-content-between">
                                <strong>{{ m.sender_full or m.sender_name }}</strong>
                                <small class="text-white-50">{{ m.timestamp }}</small>
                            </div>
                            <p class="mb-0 mt-2">{{ m.content }}</p>
                        </div>
                        {% else %}
                        <p class="text-white-50">Нет сообщений</p>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

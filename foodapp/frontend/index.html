<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodApp - Управление общепитом</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --dark: #1a1a2e;
            --light: #f8f9fa;
        }
        body {
            background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%);
            min-height: 100vh;
            color: var(--light);
        }
        .login-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .dashboard-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar {
            background: rgba(0,0,0,0.3);
            min-height: 100vh;
        }
        .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 20px;
            border-radius: 10px;
            margin: 5px 0;
            transition: all 0.3s;
        }
        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .table-dark {
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="loginPage" class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="login-card p-5 col-md-4">
            <h2 class="text-center mb-4">🍽️ FoodApp</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label>Логин</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label>Пароль</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardPage" class="container-fluid d-none">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3">
                <h4 class="text-center mb-4">🍽️ FoodApp</h4>
                <div id="navMenu"></div>
                <button class="btn btn-outline-light w-100 mt-4" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Выход
                </button>
            </div>
            
            <!-- Content -->
            <div class="col-md-10 p-4">
                <h2 id="pageTitle" class="mb-4">Дашборд</h2>
                <div id="content"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let token = localStorage.getItem('token');
        let userRole = localStorage.getItem('role');

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            
            try {
                const response = await fetch('/token', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    localStorage.setItem('token', token);
                    localStorage.setItem('username', username);
                    showDashboard();
                } else {
                    alert('Неверный логин или пароль');
                }
            } catch (error) {
                alert('Ошибка соединения');
            }
        });

        function showDashboard() {
            document.getElementById('loginPage').classList.add('d-none');
            document.getElementById('dashboardPage').classList.remove('d-none');
            loadDashboard();
        }

        async function loadDashboard() {
            const endpoint = userRole === 'admin' ? '/api/admin/dashboard' : '/api/manager/dashboard';
            
            try {
                const response = await fetch(endpoint, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    renderDashboard(data);
                } else {
                    logout();
                }
            } catch (error) {
                console.error(error);
            }
        }

        function renderDashboard(data) {
            const isAdmin = userRole === 'admin';
            
            let html = `<div class="row">`;
            
            if (isAdmin) {
                html += `
                    <div class="col-md-3 mb-4">
                        <div class="dashboard-card p-4">
                            <i class="bi bi-people fs-1 text-primary"></i>
                            <h5 class="mt-3">Менеджеры</h5>
                            <div class="stat-number">${data.managers_count}</div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-4">
                        <div class="dashboard-card p-4">
                            <i class="bi bi-building fs-1 text-success"></i>
                            <h5 class="mt-3">Клиенты</h5>
                            <div class="stat-number">${data.clients_count}</div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-4">
                        <div class="dashboard-card p-4">
                            <i class="bi bi-factory fs-1 text-warning"></i>
                            <h5 class="mt-3">Производство</h5>
                            <div class="stat-number">${data.production_count}</div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-4">
                        <div class="dashboard-card p-4">
                            <i class="bi bi-cash-stack fs-1 text-info"></i>
                            <h5 class="mt-3">Прибыль сегодня</h5>
                            <div class="stat-number">${data.today_profit} ₽</div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="col-md-3 mb-4">
                        <div class="dashboard-card p-4">
                            <i class="bi bi-people fs-1 text-primary"></i>
                            <h5 class="mt-3">Мои клиенты</h5>
                            <div class="stat-number">${data.my_clients}</div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-4">
                        <div class="dashboard-card p-4">
                            <i class="bi bi-cart fs-1 text-success"></i>
                            <h5 class="mt-3">Заказы сегодня</h5>
                            <div class="stat-number">${data.my_today_orders}</div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-4">
                        <div class="dashboard-card p-4">
                            <i class="bi bi-cash-stack fs-1 text-info"></i>
                            <h5 class="mt-3">Прибыль сегодня</h5>
                            <div class="stat-number">${data.my_today_profit} ₽</div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-4">
                        <div class="dashboard-card p-4">
                            <i class="bi bi-envelope fs-1 text-warning"></i>
                            <h5 class="mt-3">Сообщения</h5>
                            <div class="stat-number">${data.unread_messages}</div>
                        </div>
                    </div>
                `;
            }
            
            html += `</div>`;
            
            // Таблица заказов
            const orders = isAdmin ? data.recent_orders : data.my_orders;
            if (orders && orders.length > 0) {
                html += `
                    <div class="dashboard-card p-4">
                        <h5>${isAdmin ? 'Последние заказы' : 'Мои заказы'}</h5>
                        <table class="table table-dark table-hover mt-3">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Клиент</th>
                                    <th>Блюдо</th>
                                    <th>Кол-во</th>
                                    <th>Сумма</th>
                                    <th>Прибыль</th>
                                    <th>Статус</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                orders.forEach(order => {
                    html += `
                        <tr>
                            <td>${order.id}</td>
                            <td>${order.client_name || '-'}</td>
                            <td>${order.dish_name || '-'}</td>
                            <td>${order.quantity}</td>
                            <td>${order.total} ₽</td>
                            <td>${order.profit} ₽</td>
                            <td><span class="badge bg-${order.payment_status === 'Оплачено' ? 'success' : 'warning'}">${order.payment_status}</span></td>
                        </tr>
                    `;
                });
                
                html += `</tbody></table></div>`;
            }
            
            // Активность пользователей (только админ)
            if (isAdmin && data.user_activity) {
                html += `
                    <div class="dashboard-card p-4 mt-4">
                        <h5>Активность пользователей (24ч)</h5>
                        <table class="table table-dark table-hover mt-3">
                            <thead>
                                <tr>
                                    <th>Пользователь</th>
                                    <th>Роль</th>
                                    <th>Действий</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                data.user_activity.forEach(u => {
                    html += `
                        <tr>
                            <td>${u.username}</td>
                            <td>${u.role}</td>
                            <td>${u.actions}</td>
                        </tr>
                    `;
                });
                
                html += `</tbody></table></div>`;
            }
            
            document.getElementById('content').innerHTML = html;
            renderNav(isAdmin);
        }

        function renderNav(isAdmin) {
            const navItems = isAdmin ? [
                { icon: 'bi-speedometer2', text: 'Дашборд', action: 'loadDashboard()' },
                { icon: 'bi-people', text: 'Клиенты', action: 'loadClients()' },
                { icon: 'bi-factory', text: 'Производство', action: 'loadProduction()' },
                { icon: 'bi-cart', text: 'Заказы', action: 'loadOrders()' },
                { icon: 'bi-envelope', text: 'Сообщения', action: 'loadMessages()' },
                { icon: 'bi-file-earmark', text: 'Файлы', action: 'loadFiles()' },
                { icon: 'bi-chat-dots', text: 'Обратная связь', action: 'loadFeedback()' },
                { icon: 'bi-journal-text', text: 'Логи', action: 'loadLogs()' }
            ] : [
                { icon: 'bi-speedometer2', text: 'Дашборд', action: 'loadDashboard()' },
                { icon: 'bi-people', text: 'Мои клиенты', action: 'loadClients()' },
                { icon: 'bi-cart', text: 'Заказы', action: 'loadOrders()' },
                { icon: 'bi-envelope', text: 'Сообщения', action: 'loadMessages()' },
                { icon: 'bi-file-earmark', text: 'Файлы', action: 'loadFiles()' }
            ];
            
            let html = '';
            navItems.forEach(item => {
                html += `<a class="nav-link" onclick="${item.action}"><i class="bi ${item.icon} me-2"></i>${item.text}</a>`;
            });
            
            document.getElementById('navMenu').innerHTML = html;
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        // Проверка авторизации
        if (token) {
            showDashboard();
        }
    </script>
</body>
</html>
